<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Girling Design</title>
  <meta name="description" content="Girling Design. Website coming soon.">
  <style>
    :root { --bg: #ffffff; --fg: #1a1a1a; --muted: #5a5a5a; --line: #d9d9d9; }
    @media (prefers-color-scheme: dark) { :root { --bg: #141414; --fg: #f2f2f2; --muted: #a8a8a8; --line: #333; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; line-height: 1.5; }
    main { width: 100%; max-width: 36rem; padding: 2rem 1.25rem; text-align: center; }
    h1 { margin: 0 0 .75rem; font-size: clamp(2rem, 6vw, 3rem); font-weight: 600; letter-spacing: .01em; }
    p { margin: 0; color: var(--muted); font-size: 1.125rem; }
    hr { border: 0; border-top: 1px solid var(--line); width: 3rem; margin: 1.5rem auto; }
  </style>
</head>
<body>
  <main>
    <h1>Girling Design</h1>
    <hr>
    <p>Graphic design. Website coming soon.</p>
  </main>
</body>
</html>
